services:
  # Servicio del Backend (Node.js + Express)
  backend:
    # Sin container_name: Docker nombra los contenedores <carpeta>-backend-1,
    # asi los clones de dev y prod no chocan entre si.
    build:
      context: ./backend
    ports:
      - "${APP_PORT:-8082}:3000" # puerto del host : puerto del contenedor (APP_PORT sale del .env)
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=vitrostock
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD} # Tomado de las variables de entorno / secrets del servidor
    depends_on:
      - db
    networks:
      - internal
    restart: unless-stopped

  # Servicio de la Base de Datos (PostgreSQL)
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=vitrostock
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data # Persistencia de datos para que no se borren al reiniciar
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro # Crea las tablas la primera vez que se inicializa la BD
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
