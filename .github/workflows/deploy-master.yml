name: CI/CD Master - VitroStock

# Produccion: se dispara con cada push a master o manualmente
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: CI - Instalar dependencias y validar sintaxis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxis de todos los modulos
        run: |
          for f in $(find src -name "*.js"); do
            node --check "$f" || exit 1
          done

  deploy:
    name: CD - Desplegar en el VPS (master = produccion)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y desplegar
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/projects/electivaVNocturno/equipo-7/vitrostock-prod
            git fetch origin master
            git checkout master
            git pull origin master
            printf 'APP_PORT=%s\nDB_PASSWORD=%s\n' '${{ secrets.APP_PORT_PROD }}' '${{ secrets.DB_PASSWORD }}' > .env
            chmod 600 .env
            docker compose up -d --build
            docker image prune -f
