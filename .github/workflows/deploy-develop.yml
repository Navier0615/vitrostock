name: CI/CD Develop - VitroStock

# Se dispara con cada push a develop o manualmente desde la pestaña Actions
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  # ---------- CI: verifica que el codigo al menos compila ----------
  build:
    name: CI - Instalar dependencias y validar sintaxis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci instala exactamente lo que dice package-lock.json (reproducible)
      - name: Instalar dependencias
        run: npm ci

      # node --check parsea cada archivo sin ejecutarlo: detecta errores de sintaxis
      - name: Validar sintaxis de todos los modulos
        run: |
          for f in $(find src -name "*.js"); do
            node --check "$f" || exit 1
          done

  # ---------- CD: despliega en el VPS por SSH ----------
  deploy:
    name: CD - Desplegar en el VPS (develop)
    needs: build          # si el CI falla, no se despliega
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y desplegar
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/projects/electivaVNocturno/equipo-7/vitrostock-dev
            git fetch origin develop
            git checkout develop
            git pull origin develop
            printf 'APP_PORT=%s\nDB_PASSWORD=%s\n' '${{ secrets.APP_PORT_DEV }}' '${{ secrets.DB_PASSWORD }}' > .env
            chmod 600 .env
            docker compose up -d --build
            docker image prune -f
